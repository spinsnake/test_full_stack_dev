services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gallery_db}
      MYSQL_USER: ${MYSQL_USER:-gallery_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gallery_app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/migration:/migrations:ro
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "mysql://${MYSQL_USER:-gallery_app}:${MYSQL_PASSWORD:-gallery_app}@tcp(mysql:3306)/${MYSQL_DATABASE:-gallery_db}?x-multi-statement=true",
        "up"
      ]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_NAME: image-gallery-api
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      API_PREFIX: /api
      CORS_ALLOW_ORIGINS: "*"
      CORS_ALLOW_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOW_HEADERS: Origin,Content-Type,Accept,Authorization
      CORS_ALLOW_CREDENTIALS: "false"
      DEFAULT_PAGE_LIMIT: 12
      MAX_PAGE_LIMIT: 60
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 25
      DB_CONN_MAX_LIFETIME_MIN: 30
      DB_CONN_MAX_IDLE_TIME_MIN: 10
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-gallery_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gallery_app}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gallery_db}
      MYSQL_PARAMS: "parseTime=true&loc=Local&charset=utf8mb4"
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8081}/api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
